<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/painel/painel.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lemon Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Lemon Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: Lemon black/lime agency panel; month cards with a row per post. */
:root{
  --ink:#0d0d0b;--ink-2:#171714;--ink-3:#24241f;--line:#34342c;
  --lime:#c8f20d;--lime-ink:#141a00;--paper:#f4f4ef;--mute:#a3a394;--warn:#ff9b4a;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:17px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.06em}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--lime);display:block}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,68px);line-height:.9;margin:8px 0 0}
h1 em{font-style:normal;color:var(--lime)}
.btn{border:1px solid var(--line);background:var(--ink-3);border-radius:10px;padding:10px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.btn.main{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login input{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:18px}
.err{color:var(--warn);min-height:1.4em;margin:0}
.month{margin-top:28px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2);overflow:hidden}
.mh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1}
.chip{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:99px}
.chip.ok{background:var(--lime);color:var(--lime-ink)}
.chip.open{background:var(--ink-3);color:var(--paper);border:1px solid var(--line)}
.chip.w{background:var(--warn);color:#2a1300}
.meta{color:var(--mute);font-size:15px;margin-top:4px}
.nums{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.nums div{display:grid}
.nums b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.nums span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.nums .a b{color:var(--lime)} .nums .w b{color:var(--warn)}
.rows{display:grid}
.row{display:grid;grid-template-columns:56px 52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--ink-3);display:block}
.row .id{font-family:var(--f-display);font-size:26px}
.row .d{min-width:0}
.row .d small{display:block;color:var(--mute);font-size:14px}
.row .note{color:var(--paper);overflow-wrap:anywhere}
.row .when{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row.w{background:rgba(255,155,74,.07)}
.foot{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.empty{color:var(--mute);padding:20px}
.pub{display:grid;gap:4px;justify-items:start}
.pub span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.pub label{display:flex;align-items:center;gap:8px;border:1px solid var(--lime);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--lime)}
.pub label svg{width:18px;height:18px;flex:none}
.pub input{background:transparent;border:0;color:var(--paper);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;color-scheme:dark;cursor:pointer}
.pub small{font-size:13px;color:var(--mute);min-height:1.2em}
.pub small.ok{color:var(--lime)} .pub small.bad{color:var(--warn)}
.pub.none label{border-color:var(--warn);color:var(--warn)}
@media (max-width:700px){.row{grid-template-columns:48px 40px minmax(0,1fr)}.row .when{grid-column:3;text-align:left}.row .pub{grid-column:1 / -1}.row img{width:48px;height:60px}}
a.btn{color:var(--paper)}
.clis{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.clis button{border:1px solid var(--line);background:var(--ink-2);border-radius:99px;padding:8px 18px;font-weight:700;font-size:16px;letter-spacing:.04em}
.clis button[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.crumb{margin-top:18px;color:var(--mute);font-size:17px}
.crumb a{color:var(--lime);text-decoration:none;font-weight:600}
.crumb span{color:var(--paper)}
.pick{display:grid;gap:12px;max-width:560px;margin-top:30px}
.pbtn{display:flex;justify-content:space-between;align-items:center;background:var(--lime);color:var(--lime-ink);text-decoration:none;border-radius:14px;padding:18px 24px;font-family:var(--f-display);font-size:clamp(30px,6vw,42px);letter-spacing:.04em;line-height:1}
.pbtn i{font-style:normal}
.pbtn:hover{filter:brightness(1.06)}
.mlead{font-family:var(--f-display);font-size:30px;letter-spacing:.04em;margin:26px 0 12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.opt{display:grid;gap:6px;align-content:start;justify-items:start;background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--paper)}
.opt:hover{border-color:var(--lime)}
.opt small{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.opt b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.03em}
.opt .onums{font-size:15px;color:var(--mute)}
.opt.lk b{font-size:26px;color:var(--lime)}
.voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:9px 16px;border:1px solid var(--lime);border-radius:10px;color:var(--lime)!important;text-decoration:none;font-weight:700;letter-spacing:.04em;font-size:17px}
.voltar:hover{background:var(--lime);color:var(--lime-ink)!important}
.prod{border:1px solid var(--lime);border-radius:18px;background:linear-gradient(180deg,rgba(200,242,13,.07),rgba(200,242,13,.02));padding:20px 22px;margin-top:22px;display:grid;gap:16px}
.prod .pl{color:var(--mute);margin:0}
.prod .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.prod .ph small{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.prod .ph b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5vw,46px);line-height:1;letter-spacing:.03em;margin-top:6px}
.pbadge{font-weight:700;font-size:16px;border-radius:99px;padding:7px 14px;letter-spacing:.03em}
.pbadge.g{background:var(--lime);color:var(--lime-ink)} .pbadge.y{background:#ffd23f;color:#2a2000} .pbadge.r{background:#ff5a4a;color:#fff}
.pwarn{margin:0;color:var(--warn);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pc{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.pcl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.pc b{font-size:22px}
.pc small{color:var(--mute);font-size:14px}
.pc input[type=date]{background:transparent;border:1px solid var(--lime);border-radius:8px;color:var(--paper);padding:6px 8px;font:inherit;font-size:17px;color-scheme:dark;justify-self:start}
.psug{display:grid;gap:8px}
.prow{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:grid;gap:2px;text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pchip b{font-size:19px} .pchip small{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pchip:hover{border-color:var(--lime)}
.pchip.lim{border-color:#ff5a4a} .pchip.past{opacity:.45}
.pprazos{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.pprazos label{display:flex;align-items:center;gap:6px;color:var(--mute)}
.pprazos input{width:58px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:5px 8px;font:inherit;font-size:17px;text-align:center}
.pnote{margin:0;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><i></i><span>Lemon Social · Painel</span></div>
      <h1><span id="h1t">Aprovações</span> <em id="cliName"></em></h1>
    </div>
    <div id="actions" hidden style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="/painel/acessos/" style="text-decoration:none">Acessos</a>
      <a class="btn" href="/painel/avaliacoes/" style="text-decoration:none">Avaliações</a>
      <button class="btn" id="refresh">Atualizar</button>
      <button class="btn" id="logout">Sair</button>
    </div>
  </header>

  <form class="login" id="login">
    <label for="pw" style="font-family:var(--f-display);font-size:28px;letter-spacing:.04em">Senha do painel</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn main" type="submit">Entrar</button>
    <p class="err" id="err"></p>
  </form>

  <nav class="crumb" id="crumb" hidden aria-label="Navegação"></nav>
  <section class="pick" id="pick" hidden></section>
  <section class="menu" id="menu" hidden></section>
  <main id="list" hidden></main>
</div>

<script>
(function(){
  const CLIENTS = [
    { slug:'drgilvan', name:'Dr. Gilvan' },
    { slug:'premiumgrass', name:'Premium Grass' },
    { slug:'yasmine', name:'Yasmine' }
  ];
  let CLIENT = '', SEC = '';
  const parseHash = () => { const [c, m] = decodeURIComponent(location.hash.slice(1)).split('/'); CLIENT = CLIENTS.some(x => x.slug === c) ? c : ''; SEC = CLIENT ? (m || '') : ''; };
  parseHash();
  const nameOf = s => (CLIENTS.find(c => c.slug === s) || {}).name || s;
  const $ = id => document.getElementById(id);
  let senha = '';
  try { senha = localStorage.getItem('lemon-painel') || ''; } catch(e) {}
  const cache = {};
  const FMT = {post:'Post', carrossel:'Carrossel', reels:'Reels', youtube:'YouTube'};
  const fmt = iso => iso ? new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';

  async function loadPage(){
    if (cache[CLIENT]) return cache[CLIENT];
    const html = await (await fetch('/' + CLIENT + '/', {cache:'no-store'})).text();
    const m = html.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/);
    const data = JSON.parse(m[1]); cache[CLIENT] = data;
    data.months.forEach(mo => (mo.youtube || []).forEach(y => mo.posts.push({id: y.id, format: 'youtube', images: [], date: '', title: 'YouTube · ' + y.title})));
    const FN = {reels:'Reels', carrossel:'Carrossel', youtube:'YouTube'};
    for (const mo of data.months.slice()) {
      if (!mo.plan) continue;
      try {
        const P = await (await fetch('/' + CLIENT + '/planejamento/plan-' + mo.id + '.json', {cache:'no-store'})).json();
        data.months.push({id: P.id, isPlan: true, label: 'Planejamento ' + P.label, year: P.year, posts: P.items.map(i => ({id: i.id, format: i.format, date: i.date, title: FN[i.format] + ' ' + String(i.n).padStart(2, '0') + (i.v ? ' (V' + i.v + ')' : '') + ' · ' + i.title}))});
      } catch(e) {}
    }
    return data;
  }

  async function load(){
    $('err').textContent = '';
    const r = await fetch('/api/painel/' + CLIENT, {headers:{'x-senha': senha}, cache:'no-store'});
    if (r.status === 401) { $('err').textContent = 'Senha incorreta.'; show(false); return; }
    if (!r.ok) { $('err').textContent = 'Não foi possível carregar agora. Tente de novo.'; return; }
    const res = await r.json();
    try { localStorage.setItem('lemon-painel', senha); } catch(e) {}
    const want = CLIENT;
    const page = await loadPage();
    const dates = {};
    await Promise.all(page.months.filter(m => !m.isPlan).map(m => fetch('/api/datas/' + CLIENT + '/' + m.id, {cache:'no-store'}).then(r => r.ok ? r.json() : {dates:{}}).catch(() => ({dates:{}})).then(r => { dates[m.id] = r.dates || {}; })));
    if (want !== CLIENT) return;
    show(true);
    const meses = res.meses || {};
    const cur = page.months.find(m => m.id === SEC);
    let fim = '';
    page.months.forEach(m => { const ov = dates[m.id] || {}; m.posts.forEach(p => { const d = (!m.isPlan && p.id in ov) ? ov[p.id] : p.date; if (d && d > fim) fim = d; }); });
    page.fim = fim;
    if (cur) { $('menu').hidden = true; $('list').hidden = false; render(Object.assign({}, page, {months: [cur]}), meses, dates); crumbs(cur.label + ' ' + cur.year); }
    else { $('list').hidden = true; renderMenu(page, meses); crumbs(''); }
  }
  function crumbs(last){
    const c = $('crumb'); c.textContent = ''; c.hidden = false;
    const back = el('a', 'voltar', '← Voltar'); back.href = last ? '#' + CLIENT : '#'; c.append(back, el('br'));
    const a = el('a', null, '← Clientes'); a.href = '#'; c.appendChild(a);
    if (CLIENT) { c.append(' / '); if (last) { const b = el('a', null, nameOf(CLIENT)); b.href = '#' + CLIENT; c.appendChild(b); c.append(' / '); c.appendChild(el('span', null, last)); } else c.appendChild(el('span', null, nameOf(CLIENT))); }
  }
  function renderPick(){
    $('menu').hidden = true; $('list').hidden = true; $('crumb').hidden = true;
    $('cliName').textContent = ''; $('h1t').textContent = 'Qual cliente?';
    document.title = 'Painel · Lemon Social';
    const box = $('pick'); box.textContent = ''; box.hidden = false;
    CLIENTS.forEach(c => { const a = el('a', 'pbtn'); a.href = '#' + c.slug; a.append(el('span', null, c.name), el('i', null, '→')); box.appendChild(a); });
  }
  function renderMenu(page, meses){
    const box = $('menu'); box.textContent = ''; box.hidden = false;
    const prod = el('section', 'prod'); prod.appendChild(el('p', 'pl', 'Carregando produção…')); box.appendChild(prod);
    loadProd(prod, page.fim);
    box.appendChild(el('p', 'mlead', 'O que você quer ver?'));
    const grid = el('div', 'mgrid');
    page.months.slice().reverse().forEach(m => {
      const rec = meses[m.id] || {}, st = rec.state || {};
      let a = 0, w = 0; m.posts.forEach(p => { const s = st[p.id] || {}; if (s.status === 'a') a++; else if (s.status === 'w') w++; });
      const pend = m.posts.length - a - w;
      const o = el('a', 'opt'); o.href = '#' + CLIENT + '/' + m.id;
      o.appendChild(el('small', null, m.isPlan ? 'Planejamento' : 'Aprovação de posts'));
      o.appendChild(el('b', null, m.label.replace(/^Planejamento /, '') + ' ' + m.year));
      const chip = !m.posts.length ? el('span', 'chip open', 'Em produção') : rec.finalizedAt ? el('span', 'chip ok', '✓ Enviado') : rec.startedAt ? el('span', 'chip open', 'Em andamento') : el('span', 'chip open', 'Não iniciado');
      o.appendChild(chip);
      if (m.posts.length) o.appendChild(el('span', 'onums', a + ' aprovados · ' + w + ' ajustes · ' + pend + ' pendentes'));
      grid.appendChild(o);
    });
    const lp = el('a', 'opt lk'); lp.href = '/' + CLIENT + '/'; lp.target = '_blank'; lp.rel = 'noopener'; lp.append(el('small', null, 'Link'), el('b', null, 'Página do cliente ↗')); grid.appendChild(lp);
    if (page.drive) { const dv = el('a', 'opt lk'); dv.href = page.drive; dv.target = '_blank'; dv.rel = 'noopener'; dv.append(el('small', null, 'Arquivos'), el('b', null, 'Drive ↗')); grid.appendChild(dv); }
    box.appendChild(grid);
  }
  // ---- produção: próxima gravação ----
  const FER = new Set(['2026-01-01','2026-02-16','2026-02-17','2026-04-03','2026-04-21','2026-05-01','2026-06-04','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25',
    '2027-01-01','2027-02-08','2027-02-09','2027-03-26','2027-04-21','2027-05-01','2027-05-27','2027-09-07','2027-10-12','2027-11-02','2027-11-15','2027-11-20','2027-12-25']);
  const pad = n => String(n).padStart(2, '0');
  const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const isBD = d => d.getDay() !== 0 && d.getDay() !== 6 && !FER.has(isoD(d));
  const stepBD = (d, n, dir) => { d = new Date(d); let k = 0; while (k < n) { d.setDate(d.getDate() + dir); if (isBD(d)) k++; } return d; };
  const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const daysTo = d => Math.round((d - today()) / 864e5);
  const WDS = ['dom','seg','ter','qua','qui','sex','sáb'];
  const fd = d => WDS[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  const bdBetween = (a, b) => { let n = 0, d = new Date(a); while (d < b) { d.setDate(d.getDate() + 1); if (isBD(d)) n++; } return n; };
  async function loadProd(box, fim){
    let cfg = {};
    try { const r = await fetch('/api/painel/' + CLIENT + '/producao', {headers:{'x-senha': senha}, cache:'no-store'}); if (r.ok) cfg = await r.json(); } catch(e) {}
    cfg = Object.assign({gravacao:'', proxima:'', edicao:5, aprovacao:2, folga:2}, cfg);
    const cli = CLIENT;
    const save = async () => {
      if (cli !== CLIENT) return;
      try { await fetch('/api/painel/' + cli + '/producao', {method:'PUT', headers:{'x-senha': senha, 'content-type':'application/json'}, body: JSON.stringify(cfg)}); } catch(e) {}
    };
    const draw = () => {
      box.textContent = '';
      const head = el('div', 'ph');
      const left = el('div'); left.appendChild(el('small', null, 'Produção · próxima gravação'));
      const ttl = el('b'); left.appendChild(ttl); head.appendChild(left);
      const badge = el('span', 'pbadge'); head.appendChild(badge);
      box.appendChild(head);
      const total = cfg.edicao + cfg.aprovacao + cfg.folga;
      let limite = null;
      if (fim) limite = stepBD(stepBD(parseD(fim), 1, 1), total, -1);
      const prox = cfg.proxima ? parseD(cfg.proxima) : null;
      if (!limite) { ttl.textContent = 'Sem datas de publicação'; badge.textContent = 'Defina as datas'; badge.className = 'pbadge y'; }
      else if (prox && prox <= limite) { ttl.textContent = 'Gravação agendada: ' + fd(prox); const n = daysTo(prox); badge.textContent = n > 0 ? '✓ No prazo · em ' + n + (n === 1 ? ' dia' : ' dias') : n === 0 ? '✓ É hoje' : '✓ Gravado?'; badge.className = 'pbadge g'; }
      else {
        const n = daysTo(limite);
        ttl.textContent = 'Gravar até ' + fd(limite);
        if (n < 0) { badge.textContent = '⚠ Atrasado ' + (-n) + (n === -1 ? ' dia' : ' dias'); badge.className = 'pbadge r'; }
        else { badge.textContent = (n === 0 ? 'É hoje' : 'Faltam ' + n + (n === 1 ? ' dia' : ' dias')); badge.className = 'pbadge ' + (n <= 7 ? 'r' : n <= 14 ? 'y' : 'g'); }
        if (prox) { const w = el('p', 'pwarn', '⚠ A gravação agendada (' + fd(prox) + ') fica depois da data limite. O conteúdo pode acabar antes da entrega.'); box.appendChild(w); }
      }
      const grid = el('div', 'pgrid');
      const cell = (lb, val, sub) => { const c = el('div', 'pc'); c.appendChild(el('span', 'pcl', lb)); if (val instanceof Node) c.appendChild(val); else c.appendChild(el('b', null, val)); if (sub) c.appendChild(el('small', null, sub)); grid.appendChild(c); return c; };
      cell('Conteúdo programado até', fim ? fd(parseD(fim)) : 'Sem datas', fim ? (daysTo(parseD(fim)) >= 0 ? 'faltam ' + daysTo(parseD(fim)) + ' dias' : 'já acabou') : 'coloque as datas no planejamento');
      const dIn = (key) => { const i = el('input'); i.type = 'date'; i.value = cfg[key] || ''; i.onchange = () => { cfg[key] = i.value; save(); draw(); }; return i; };
      let sub = '';
      if (cfg.gravacao) { const ent = stepBD(parseD(cfg.gravacao), cfg.edicao, 1); const k = bdBetween(today(), ent); sub = 'Entrega para aprovação: ' + fd(ent) + (ent >= today() ? ' (' + k + (k === 1 ? ' dia útil)' : ' dias úteis)') : ' (prazo passou)'); }
      cell('Última gravação', dIn('gravacao'), sub || 'Coloque a data para calcular a entrega');
      cell('Próxima gravação agendada', dIn('proxima'), cfg.proxima ? (limite && parseD(cfg.proxima) <= limite ? 'Dentro do prazo' : 'Depois da data limite') : 'Ainda não agendada');
      box.appendChild(grid);
      if (limite) {
        const sg = el('div', 'psug'); sg.appendChild(el('span', 'pcl', 'Datas sugeridas para gravar'));
        const row = el('div', 'prow');
        [[stepBD(limite, 5, -1), 'Com folga'], [stepBD(limite, 2, -1), 'Recomendada'], [limite, 'Data limite']].forEach(([d, l], k) => {
          const b = el('button', 'pchip' + (k === 2 ? ' lim' : '') + (d < today() ? ' past' : '')); b.type = 'button';
          b.append(el('b', null, fd(d)), el('small', null, l)); b.title = 'Agendar gravação nesta data';
          b.onclick = () => { cfg.proxima = isoD(d); save(); draw(); };
          row.appendChild(b);
        });
        sg.appendChild(row); box.appendChild(sg);
      }
      const pz = el('div', 'pprazos');
      const nIn = (key, lb) => { const w = el('label'); const i = el('input'); i.type = 'number'; i.min = 0; i.max = 60; i.value = cfg[key]; i.onchange = () => { cfg[key] = Math.max(0, Math.min(60, parseInt(i.value, 10) || 0)); save(); draw(); }; w.append(i, el('span', null, lb)); return w; };
      pz.append(el('span', 'pcl', 'Prazos em dias úteis'), nIn('edicao', 'edição'), nIn('aprovacao', 'aprovação do cliente'), nIn('folga', 'folga'));
      box.appendChild(pz);
      box.appendChild(el('p', 'pnote', 'Data limite = ' + total + ' dias úteis (edição ' + cfg.edicao + ' + aprovação ' + cfg.aprovacao + ' + folga ' + cfg.folga + ') antes do dia em que o conteúdo acaba. Fins de semana e feriados nacionais não contam.'));
    };
    draw();
  }

  function route(){
    parseHash();
    if (!senha) return;
    if (!CLIENT) {
      $('err').textContent = '';
      fetch('/api/painel/' + CLIENTS[0].slug, {headers:{'x-senha': senha}, cache:'no-store'}).then(r => {
        if (r.status === 401) { $('err').textContent = 'Senha incorreta.'; try { localStorage.removeItem('lemon-painel'); } catch(e) {} senha = ''; show(false); return; }
        show(true); renderPick();
      }).catch(() => { $('err').textContent = 'Sem conexão. Tente de novo.'; });
      return;
    }
    $('pick').hidden = true; $('h1t').textContent = 'Aprovações';
    $('cliName').textContent = nameOf(CLIENT); document.title = 'Painel · ' + nameOf(CLIENT) + ' · Lemon Social';
    $('list').textContent = ''; $('menu').textContent = '';
    load();
  }
  addEventListener('hashchange', route);
  function show(on){ $('login').hidden = on; $('actions').hidden = !on; if (!on) { $('list').hidden = true; $('menu').hidden = true; $('pick').hidden = true; $('crumb').hidden = true; } }


  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  const WD = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const wday = iso => { if (!iso) return ''; const [y,mo,d] = iso.split('-').map(Number); return WD[new Date(y, mo-1, d).getDay()]; };
  const CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>';
  function dateControl(m, p, value){
    const box = el('div', 'pub' + (value ? '' : ' none'));
    box.appendChild(el('span', null, 'Programar publicação'));
    const lab = el('label'); lab.innerHTML = CAL;
    const inp = el('input'); inp.type = 'date'; inp.value = value || ''; inp.id = 'd-' + m.id + '-' + p.id;
    inp.setAttribute('aria-label', 'Data de publicação do conteúdo ' + p.id);
    lab.appendChild(inp);
    lab.addEventListener('click', () => { try { inp.showPicker(); } catch(e) {} });
    const msg = el('small', null, value ? wday(value) : 'Sem data');
    box.append(lab, msg);
    inp.addEventListener('change', async () => {
      msg.className = ''; msg.textContent = 'Salvando…';
      try {
        const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/data', {method:'PUT', headers:{'x-senha': senha, 'content-type':'application/json'}, body: JSON.stringify({id: p.id, date: inp.value})});
        if (!r.ok) throw r;
        msg.className = 'ok'; msg.textContent = '✓ Salvo' + (inp.value ? ' · ' + wday(inp.value) : '');
        box.classList.toggle('none', !inp.value);
      } catch(e) { msg.className = 'bad'; msg.textContent = 'Não salvou. Tente de novo.'; }
    });
    return box;
  }

  function render(page, meses, dates){
    dates = dates || {};
    const list = $('list'); list.textContent = '';
    page.months.slice().reverse().forEach(m => {
      const rec = meses[m.id] || {state:{}}, st = rec.state || {};
      let a = 0, w = 0;
      m.posts.forEach(p => { const s = st[p.id] || {}; if (s.status === 'a') a++; else if (s.status === 'w') w++; });
      const pend = m.posts.length - a - w;
      const box = el('section', 'month');
      const mh = el('div', 'mh');
      const left = el('div');
      const h = el('h2', null, m.label + ' ' + m.year);
      const chip = rec.finalizedAt ? el('span', 'chip ok', '✓ Finalizada') : (rec.startedAt ? el('span', 'chip open', 'Em andamento') : el('span', 'chip open', 'Não iniciada'));
      const t = el('div', 'meta', rec.finalizedAt ? 'Enviada em ' + fmt(rec.finalizedAt) : rec.updatedAt ? 'Última alteração em ' + fmt(rec.updatedAt) : 'O cliente ainda não abriu este mês.');
      const hh = el('div'); hh.style.cssText = 'display:flex;align-items:center;gap:12px;flex-wrap:wrap'; hh.append(h, chip);
      left.append(hh, t);
      const nums = el('div', 'nums');
      [['a', a, 'Aprovados'], ['w', w, 'Correções'], ['', pend, 'Pendentes']].forEach(([c, n, l]) => { const d = el('div', c); d.append(el('b', null, String(n)), el('span', null, l)); nums.appendChild(d); });
      mh.append(left, nums);
      box.appendChild(mh);

      const rows = el('div', 'rows');
      const ov = dates[m.id] || {};
      const dateOf = p => (p.id in ov) ? ov[p.id] : (p.date || '');
      const ordered = m.posts.slice().sort((x, y) => (((st[y.id]||{}).status === 'w') - ((st[x.id]||{}).status === 'w')) || (dateOf(x) || '9').localeCompare(dateOf(y) || '9'));
      ordered.forEach(p => {
        const s = st[p.id] || {};
        const row = el('div', 'row' + (s.status === 'w' ? ' w' : ''));
        const img = (m.isPlan || !(p.images || []).length) ? el('div') : el('img'); if (img.tagName === 'IMG') { img.alt = ''; img.loading = 'lazy'; img.src = '/' + CLIENT + '/' + ((p.images || [])[0] || ''); }
        const d = el('div', 'd');
        const chipS = s.status === 'a' ? el('span', 'chip ok', 'Aprovado') : s.status === 'w' ? el('span', 'chip w', 'Correção') : el('span', 'chip open', 'Pendente');
        d.appendChild(chipS);
        if (s.status === 'w') {
          d.appendChild(el('small', null, s.type || 'Tipo não informado'));
          d.appendChild(el('div', 'note', (s.note || '').trim() || 'Sem descrição.'));
        } else d.appendChild(el('small', null, m.isPlan ? '' : (FMT[p.format] || 'Post')));
        if (m.isPlan) d.insertBefore(el('div', null, p.title), d.firstChild);
        row.append(img, el('div', 'id', p.id), d, m.isPlan ? el('div', 'when', p.date ? p.date.slice(8) + '/' + p.date.slice(5, 7) : 'sem data') : dateControl(m, p, dateOf(p)), el('div', 'when', s.at ? fmt(s.at) : ''));
        rows.appendChild(row);
      });
      const foot = el('div', 'foot');
      if (rec.finalizedAt) {
        const b = el('button', 'btn', 'Reabrir para o cliente');
        b.onclick = async () => {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Confirmar: reabrir'; return; }
          b.disabled = true;
          const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/reabrir', {method:'POST', headers:{'x-senha': senha}});
          if (r.ok) load(); else { b.disabled = false; b.textContent = 'Erro, tente de novo'; }
        };
        foot.appendChild(b);
      }
      {
        const z = el('button', 'btn', 'Zerar respostas');
        z.onclick = async () => {
          if (z.dataset.sure !== '1') { z.dataset.sure = '1'; z.textContent = 'Confirmar: apagar tudo de ' + m.label.toLowerCase(); z.style.borderColor = 'var(--warn)'; z.style.color = 'var(--warn)'; return; }
          z.disabled = true;
          const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/zerar', {method:'POST', headers:{'x-senha': senha}});
          if (r.ok) load(); else { z.disabled = false; z.textContent = 'Erro, tente de novo'; }
        };
        foot.appendChild(z);
      }
      const copyB = el('button', 'btn', 'Copiar correções');
      copyB.onclick = () => {
        const txt = m.posts.filter(p => (st[p.id]||{}).status === 'w').map(p => '• ' + (p.title || p.id) + ' (' + ((st[p.id].type)||'correção') + '): ' + ((st[p.id].note||'').trim() || 'sem descrição')).join('\n') || 'Nenhuma correção.';
        try { navigator.clipboard.writeText((m.isPlan ? 'Ajustes ' : 'Correções ') + m.label + ' · ' + nameOf(CLIENT) + '\n' + txt).then(() => copyB.textContent = 'Copiado', () => {}); } catch(e) {}
      };
      foot.appendChild(copyB);
      box.appendChild(foot);
      box.appendChild(rows);
      list.appendChild(box);
    });
  }

  $('login').addEventListener('submit', e => { e.preventDefault(); senha = $('pw').value; try { localStorage.setItem('lemon-painel', senha); } catch(e) {} route(); });
  $('refresh').onclick = () => CLIENT ? load() : renderPick();
  $('logout').onclick = () => { senha = ''; try { localStorage.removeItem('lemon-painel'); } catch(e) {} show(false); $('pw').value = ''; };
  if (senha) route();
})();
</script>
</body>
</html>
