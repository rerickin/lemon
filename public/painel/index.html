<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Lemon Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: Lemon black/lime agency panel; month cards with a row per post. */
:root{
  --ink:#0d0d0b;--ink-2:#171714;--ink-3:#24241f;--line:#34342c;
  --lime:#c8f20d;--lime-ink:#141a00;--paper:#f4f4ef;--mute:#a3a394;--warn:#ff9b4a;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:17px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.06em}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--lime);display:block}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,68px);line-height:.9;margin:8px 0 0}
h1 em{font-style:normal;color:var(--lime)}
.btn{border:1px solid var(--line);background:var(--ink-3);border-radius:10px;padding:10px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.btn.main{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login input{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:18px}
.err{color:var(--warn);min-height:1.4em;margin:0}
.month{margin-top:28px;border:1px solid var(--line);border-radius:16px;background:var(--ink-2);overflow:hidden}
.mh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--f-display);font-weight:400;font-size:36px;margin:0;line-height:1}
.chip{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:99px}
.chip.ok{background:var(--lime);color:var(--lime-ink)}
.chip.open{background:var(--ink-3);color:var(--paper);border:1px solid var(--line)}
.chip.w{background:var(--warn);color:#2a1300}
.meta{color:var(--mute);font-size:15px;margin-top:4px}
.nums{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.nums div{display:grid}
.nums b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.nums span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.nums .a b{color:var(--lime)} .nums .w b{color:var(--warn)}
.rows{display:grid}
.row{display:grid;grid-template-columns:56px 52px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row img{width:56px;height:70px;object-fit:cover;border-radius:6px;background:var(--ink-3);display:block}
.row .id{font-family:var(--f-display);font-size:26px}
.row .d{min-width:0}
.row .d small{display:block;color:var(--mute);font-size:14px}
.row .note{color:var(--paper);overflow-wrap:anywhere}
.row .when{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.row.w{background:rgba(255,155,74,.07)}
.foot{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.empty{color:var(--mute);padding:20px}
.pub{display:grid;gap:4px;justify-items:start}
.pub span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.pub label{display:flex;align-items:center;gap:8px;border:1px solid var(--lime);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--lime)}
.pub label svg{width:18px;height:18px;flex:none}
.pub input{background:transparent;border:0;color:var(--paper);font:inherit;font-size:16px;font-variant-numeric:tabular-nums;color-scheme:dark;cursor:pointer}
.pub small{font-size:13px;color:var(--mute);min-height:1.2em}
.pub small.ok{color:var(--lime)} .pub small.bad{color:var(--warn)}
.pub.none label{border-color:var(--warn);color:var(--warn)}
@media (max-width:700px){.row{grid-template-columns:48px 40px minmax(0,1fr)}.row .when{grid-column:3;text-align:left}.row .pub{grid-column:1 / -1}.row img{width:48px;height:60px}}
a.btn{color:var(--paper)}
.clis{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.clis button{border:1px solid var(--line);background:var(--ink-2);border-radius:99px;padding:8px 18px;font-weight:700;font-size:16px;letter-spacing:.04em}
.clis button[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><i></i><span>Lemon Social · Painel</span></div>
      <h1>Aprovações <em id="cliName"></em></h1>
    </div>
    <div id="actions" hidden style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="/painel/acessos/" style="text-decoration:none">Acessos</a>
      <a class="btn" href="/painel/avaliacoes/" style="text-decoration:none">Avaliações</a>
      <button class="btn" id="refresh">Atualizar</button>
      <button class="btn" id="logout">Sair</button>
    </div>
  </header>

  <form class="login" id="login">
    <label for="pw" style="font-family:var(--f-display);font-size:28px;letter-spacing:.04em">Senha do painel</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn main" type="submit">Entrar</button>
    <p class="err" id="err"></p>
  </form>

  <nav class="clis" id="clis" hidden aria-label="Clientes"></nav>
  <main id="list" hidden></main>
</div>

<script>
(function(){
  const CLIENTS = [
    { slug:'drgilvan', name:'Dr. Gilvan' },
    { slug:'yasmine', name:'Yasmine' }
  ];
  let CLIENT = (location.hash.slice(1) && CLIENTS.some(c => c.slug === location.hash.slice(1))) ? location.hash.slice(1) : '';
  if (!CLIENT) { try { CLIENT = sessionStorage.getItem('lemon-painel-cli') || ''; } catch(e) {} }
  if (!CLIENTS.some(c => c.slug === CLIENT)) CLIENT = CLIENTS[0].slug;
  const nameOf = s => (CLIENTS.find(c => c.slug === s) || {}).name || s;
  const $ = id => document.getElementById(id);
  let senha = '';
  try { senha = sessionStorage.getItem('lemon-painel') || ''; } catch(e) {}
  const cache = {};
  const FMT = {post:'Post', carrossel:'Carrossel', reels:'Reels'};
  const fmt = iso => iso ? new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '';

  async function loadPage(){
    if (cache[CLIENT]) return cache[CLIENT];
    const html = await (await fetch('/' + CLIENT + '/', {cache:'no-store'})).text();
    const m = html.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/);
    const data = JSON.parse(m[1]); cache[CLIENT] = data;
    const FN = {reels:'Reels', carrossel:'Carrossel', youtube:'YouTube'};
    for (const mo of data.months.slice()) {
      if (!mo.plan) continue;
      try {
        const P = await (await fetch('/' + CLIENT + '/planejamento/plan-' + mo.id + '.json', {cache:'no-store'})).json();
        data.months.push({id: P.id, isPlan: true, label: 'Planejamento ' + P.label, year: P.year, posts: P.items.map(i => ({id: i.id, format: i.format, date: i.date, title: FN[i.format] + ' ' + String(i.n).padStart(2, '0') + ' · ' + i.title}))});
      } catch(e) {}
    }
    return data;
  }

  async function load(){
    $('err').textContent = '';
    const r = await fetch('/api/painel/' + CLIENT, {headers:{'x-senha': senha}, cache:'no-store'});
    if (r.status === 401) { $('err').textContent = 'Senha incorreta.'; show(false); return; }
    if (!r.ok) { $('err').textContent = 'Não foi possível carregar agora. Tente de novo.'; return; }
    const res = await r.json();
    try { sessionStorage.setItem('lemon-painel', senha); } catch(e) {}
    const want = CLIENT;
    const page = await loadPage();
    const dates = {};
    await Promise.all(page.months.filter(m => !m.isPlan).map(m => fetch('/api/datas/' + CLIENT + '/' + m.id, {cache:'no-store'}).then(r => r.ok ? r.json() : {dates:{}}).catch(() => ({dates:{}})).then(r => { dates[m.id] = r.dates || {}; })));
    if (want !== CLIENT) return;
    render(page, res.meses || {}, dates);
    show(true);
  }
  function show(on){ $('login').hidden = on; $('list').hidden = !on; $('actions').hidden = !on; $('clis').hidden = !on; }
  function renderClis(){
    $('cliName').textContent = nameOf(CLIENT);
    document.title = 'Painel · ' + nameOf(CLIENT) + ' · Lemon Social';
    const nav = $('clis'); nav.textContent = '';
    CLIENTS.forEach(c => {
      const b = el('button', null, c.name); b.type = 'button'; b.setAttribute('aria-pressed', c.slug === CLIENT);
      b.onclick = () => { if (c.slug === CLIENT) return; CLIENT = c.slug; try { sessionStorage.setItem('lemon-painel-cli', CLIENT); } catch(e) {} history.replaceState(null, '', '#' + CLIENT); renderClis(); $('list').textContent = ''; load(); };
      nav.appendChild(b);
    });
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  const WD = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const wday = iso => { if (!iso) return ''; const [y,mo,d] = iso.split('-').map(Number); return WD[new Date(y, mo-1, d).getDay()]; };
  const CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>';
  function dateControl(m, p, value){
    const box = el('div', 'pub' + (value ? '' : ' none'));
    box.appendChild(el('span', null, 'Programar publicação'));
    const lab = el('label'); lab.innerHTML = CAL;
    const inp = el('input'); inp.type = 'date'; inp.value = value || ''; inp.id = 'd-' + m.id + '-' + p.id;
    inp.setAttribute('aria-label', 'Data de publicação do conteúdo ' + p.id);
    lab.appendChild(inp);
    lab.addEventListener('click', () => { try { inp.showPicker(); } catch(e) {} });
    const msg = el('small', null, value ? wday(value) : 'Sem data');
    box.append(lab, msg);
    inp.addEventListener('change', async () => {
      msg.className = ''; msg.textContent = 'Salvando…';
      try {
        const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/data', {method:'PUT', headers:{'x-senha': senha, 'content-type':'application/json'}, body: JSON.stringify({id: p.id, date: inp.value})});
        if (!r.ok) throw r;
        msg.className = 'ok'; msg.textContent = '✓ Salvo' + (inp.value ? ' · ' + wday(inp.value) : '');
        box.classList.toggle('none', !inp.value);
      } catch(e) { msg.className = 'bad'; msg.textContent = 'Não salvou. Tente de novo.'; }
    });
    return box;
  }

  function render(page, meses, dates){
    dates = dates || {};
    const list = $('list'); list.textContent = '';
    page.months.slice().reverse().forEach(m => {
      const rec = meses[m.id] || {state:{}}, st = rec.state || {};
      let a = 0, w = 0;
      m.posts.forEach(p => { const s = st[p.id] || {}; if (s.status === 'a') a++; else if (s.status === 'w') w++; });
      const pend = m.posts.length - a - w;
      const box = el('section', 'month');
      const mh = el('div', 'mh');
      const left = el('div');
      const h = el('h2', null, m.label + ' ' + m.year);
      const chip = rec.finalizedAt ? el('span', 'chip ok', '✓ Finalizada') : (rec.startedAt ? el('span', 'chip open', 'Em andamento') : el('span', 'chip open', 'Não iniciada'));
      const t = el('div', 'meta', rec.finalizedAt ? 'Enviada em ' + fmt(rec.finalizedAt) : rec.updatedAt ? 'Última alteração em ' + fmt(rec.updatedAt) : 'O cliente ainda não abriu este mês.');
      const hh = el('div'); hh.style.cssText = 'display:flex;align-items:center;gap:12px;flex-wrap:wrap'; hh.append(h, chip);
      left.append(hh, t);
      const nums = el('div', 'nums');
      [['a', a, 'Aprovados'], ['w', w, 'Correções'], ['', pend, 'Pendentes']].forEach(([c, n, l]) => { const d = el('div', c); d.append(el('b', null, String(n)), el('span', null, l)); nums.appendChild(d); });
      mh.append(left, nums);
      box.appendChild(mh);

      const rows = el('div', 'rows');
      const ov = dates[m.id] || {};
      const dateOf = p => (p.id in ov) ? ov[p.id] : (p.date || '');
      const ordered = m.posts.slice().sort((x, y) => (((st[y.id]||{}).status === 'w') - ((st[x.id]||{}).status === 'w')) || (dateOf(x) || '9').localeCompare(dateOf(y) || '9'));
      ordered.forEach(p => {
        const s = st[p.id] || {};
        const row = el('div', 'row' + (s.status === 'w' ? ' w' : ''));
        const img = m.isPlan ? el('div') : el('img'); if (!m.isPlan) { img.alt = ''; img.loading = 'lazy'; img.src = '/' + CLIENT + '/' + ((p.images || [])[0] || ''); }
        const d = el('div', 'd');
        const chipS = s.status === 'a' ? el('span', 'chip ok', 'Aprovado') : s.status === 'w' ? el('span', 'chip w', 'Correção') : el('span', 'chip open', 'Pendente');
        d.appendChild(chipS);
        if (s.status === 'w') {
          d.appendChild(el('small', null, s.type || 'Tipo não informado'));
          d.appendChild(el('div', 'note', (s.note || '').trim() || 'Sem descrição.'));
        } else d.appendChild(el('small', null, m.isPlan ? '' : (FMT[p.format] || 'Post')));
        if (m.isPlan) d.insertBefore(el('div', null, p.title), d.firstChild);
        row.append(img, el('div', 'id', p.id), d, m.isPlan ? el('div', 'when', p.date ? p.date.slice(8) + '/' + p.date.slice(5, 7) : 'sem data') : dateControl(m, p, dateOf(p)), el('div', 'when', s.at ? fmt(s.at) : ''));
        rows.appendChild(row);
      });
      const foot = el('div', 'foot');
      if (rec.finalizedAt) {
        const b = el('button', 'btn', 'Reabrir para o cliente');
        b.onclick = async () => {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Confirmar: reabrir'; return; }
          b.disabled = true;
          const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/reabrir', {method:'POST', headers:{'x-senha': senha}});
          if (r.ok) load(); else { b.disabled = false; b.textContent = 'Erro, tente de novo'; }
        };
        foot.appendChild(b);
      }
      {
        const z = el('button', 'btn', 'Zerar respostas');
        z.onclick = async () => {
          if (z.dataset.sure !== '1') { z.dataset.sure = '1'; z.textContent = 'Confirmar: apagar tudo de ' + m.label.toLowerCase(); z.style.borderColor = 'var(--warn)'; z.style.color = 'var(--warn)'; return; }
          z.disabled = true;
          const r = await fetch('/api/painel/' + CLIENT + '/' + m.id + '/zerar', {method:'POST', headers:{'x-senha': senha}});
          if (r.ok) load(); else { z.disabled = false; z.textContent = 'Erro, tente de novo'; }
        };
        foot.appendChild(z);
      }
      const copyB = el('button', 'btn', 'Copiar correções');
      copyB.onclick = () => {
        const txt = m.posts.filter(p => (st[p.id]||{}).status === 'w').map(p => '• ' + (p.title || p.id) + ' (' + ((st[p.id].type)||'correção') + '): ' + ((st[p.id].note||'').trim() || 'sem descrição')).join('\n') || 'Nenhuma correção.';
        try { navigator.clipboard.writeText((m.isPlan ? 'Ajustes ' : 'Correções ') + m.label + ' · ' + nameOf(CLIENT) + '\n' + txt).then(() => copyB.textContent = 'Copiado', () => {}); } catch(e) {}
      };
      foot.appendChild(copyB);
      box.appendChild(foot);
      box.appendChild(rows);
      list.appendChild(box);
    });
  }

  $('login').addEventListener('submit', e => { e.preventDefault(); senha = $('pw').value; load(); });
  $('refresh').onclick = load;
  $('logout').onclick = () => { senha = ''; try { sessionStorage.removeItem('lemon-painel'); } catch(e) {} show(false); $('pw').value = ''; };
  renderClis();
  if (senha) load();
})();
</script>
</body>
</html>
