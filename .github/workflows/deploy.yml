name: Deploy Cloudflare

# Publica o site no Cloudflare Workers a cada push na main,
# sem depender do build automático da Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        run: |
          # usa só a primeira linha do token, sem espaços (evita erro se foi colado com quebra de linha)
          export CLOUDFLARE_API_TOKEN="$(printf '%s\n' "$RAW_TOKEN" | grep -m1 -v '^[[:space:]]*$' | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f7fcf62c641324619fc2aaf5546dff59
